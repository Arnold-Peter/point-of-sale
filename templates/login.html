<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f0f1a">
    <title>Noddy Store - Login</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:#0f0f1a;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px;font-family:'Segoe UI',sans-serif;}
        .card{background:#13132a;border-radius:16px;padding:40px 34px;width:100%;max-width:380px;border:1px solid #2a2a4a;box-shadow:0 20px 60px rgba(0,0,0,.5);}
        .logo{display:flex;align-items:center;gap:10px;margin-bottom:24px;}
        .logo h1{font-size:1.5rem;color:#fff;}
        .logo h1 span{color:#f39c12;}
        .subtitle{color:#888;font-size:0.85rem;margin-bottom:24px;}
        label{display:block;color:#888;font-size:0.75rem;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;}
        input{width:100%;padding:12px 14px;background:#0f0f1a;border:1px solid #2a2a4a;border-radius:8px;color:#fff;font-size:16px;margin-bottom:16px;outline:none;}
        input:focus{border-color:#f39c12;}
        .btn{width:100%;padding:13px;background:#f39c12;border:none;border-radius:8px;color:#000;font-size:1rem;font-weight:600;cursor:pointer;}
        .btn:hover{background:#e08e0b;}
        .error{background:#2a0d0d;border:1px solid #c0392b;border-radius:8px;padding:10px 14px;color:#ff6b6b;font-size:0.85rem;margin-bottom:16px;}
        .footer{text-align:center;margin-top:20px;color:#444;font-size:0.75rem;}
        @media (max-width:420px){ .card{padding:28px 20px;} }
    </style>
</head>
<body>
<div class="card">
    <div class="logo">
        <span style="font-size:2rem">🏪</span>
        <h1><span>Noddy</span> Store</h1>
    </div>
    <p class="subtitle">Sign in to access the POS system</p>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
        <label>Username</label>
        <input type="text" name="username" placeholder="Enter username"
               autocapitalize="none" autocomplete="username" required autofocus/>
        <label>Password</label>
        <input type="password" name="password" placeholder="Enter password"
               autocomplete="current-password" required/>
        <button class="btn" type="submit">Sign In</button>
    </form>
    <div class="footer">Noddy Store Point of Sale</div>
</div>
</body>
</html>
