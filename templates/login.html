<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Noddy Store — Login</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:#0f0f1a;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Segoe UI',sans-serif;}
        .card{background:#13132a;border-radius:16px;padding:44px 38px;width:370px;border:1px solid #2a2a4a;box-shadow:0 20px 60px rgba(0,0,0,.5);}
        .logo{display:flex;align-items:center;gap:10px;margin-bottom:28px;}
        .logo h1{font-size:1.5rem;color:#fff;}
        .logo h1 span{color:#f39c12;}
        .subtitle{color:#888;font-size:0.83rem;margin-bottom:28px;}
        label{display:block;color:#888;font-size:0.75rem;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;}
        input{width:100%;padding:11px 14px;background:#0f0f1a;border:1px solid #2a2a4a;border-radius:8px;color:#fff;font-size:0.9rem;margin-bottom:16px;outline:none;}
        input:focus{border-color:#f39c12;}
        .btn{width:100%;padding:12px;background:#f39c12;border:none;border-radius:8px;color:#000;font-size:0.95rem;font-weight:600;cursor:pointer;}
        .btn:hover{background:#e08e0b;}
        .error{background:#2a0d0d;border:1px solid #c0392b;border-radius:8px;padding:10px 14px;color:#ff6b6b;font-size:0.83rem;margin-bottom:16px;}
        .footer{text-align:center;margin-top:20px;color:#444;font-size:0.75rem;}
        .branch-info{background:#1a1a2e;border-radius:8px;padding:10px 14px;margin-bottom:20px;font-size:0.8rem;color:#888;}
        .branch-info strong{color:#f39c12;}
    </style>
</head>
<body>
<div class="card">
    <div class="logo">
        <span style="font-size:2rem">🏪</span>
        <h1><span>Noddy</span> Store</h1>
    </div>
    <p class="subtitle">Sign in to access the POS system</p>

    <div class="branch-info">
        Default login: <strong>admin</strong> / <strong>admin123</strong>
    </div>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
        <label>Username</label>
        <input type="text" name="username" placeholder="Enter username" required autofocus/>
        <label>Password</label>
        <input type="password" name="password" placeholder="Enter password" required/>
        <button class="btn" type="submit">Sign In</button>
    </form>
    <div class="footer">Noddy Store Point of Sale v1.0</div>
</div>
</body>
</html>
